{% extends 'base.html' %}
{% load static %}

{% block meta %}
<title>{{ nickname }} - Portfolio</title>
{% endblock meta %}

{% block content %}
<main>
    <section class="hero" id="profile">
        <div class="container hero-grid">

            <div class="hero-identity">
                <p class="hero-kicker">
                    Computer Science &middot; Universitas Indonesia
                </p>

                <h1>{{ fullname }}</h1>
            </div>

            <div class="hero-photo">
                <div class="photo-block"></div>

                <img
                    class="avatar"
                    src="{% static 'img/naufal.jpg' %}"
                    alt="Photo of {{ nickname }}"
                >
            </div>

            <div class="hero-details">
                <p class="bio">
                    {{ bio }}
                </p>

                <dl class="meta-list">
                    <div class="meta-row">
                        <dt>NPM</dt>
                        <dd>{{ npm }}</dd>
                    </div>

                    <div class="meta-row">
                        <dt>Program</dt>
                        <dd>{{ study_program }}</dd>
                    </div>
                </dl>

                <div class="social-links">
                    <a
                        href="https://github.com/naufalkhairiy"
                        class="social-link"
                    >
                        GitHub
                    </a>

                    <a
                        href="https://www.linkedin.com/in/naufal-khairiy-zulkarnain-sormin-277314370/"
                        class="social-link"
                    >
                        LinkedIn
                    </a>

                    <a
                        href="mailto:kairyreign@gmail.com"
                        class="social-link"
                    >
                        Email
                    </a>
                </div>
            </div>

        </div>
    </section>
</main>
{% endblock content %}
